version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hirewise-postgres
    restart: always
    environment:
      POSTGRES_USER: hirewise_user
      POSTGRES_PASSWORD: hirewise_password
      POSTGRES_DB: hirewise_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hirewise-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://hirewise_user:hirewise_password@db:5432/hirewise_db
      SECRET_KEY: hirewise_super_secret_jwt_key_2026_secured_default
      AI_PROVIDER: offline
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hirewise-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
